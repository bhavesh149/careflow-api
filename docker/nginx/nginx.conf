# ---------------------------------------------------------------------------
# Local stand-in for the Application Load Balancer.
#
# Its job here is to make request distribution visible: every response carries the
# X-Instance-Id of whichever task handled it, which is how the E2E suite proves that a
# hold created on api-1 can be confirmed on api-3 without any shared process memory.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS. Open-source nginx resolves the names in an `upstream` block once,
  # at startup, and never again — so the moment Compose recreates an API container and it comes
  # back on a different IP, every third request 502s until nginx itself is restarted. Resolving
  # through a variable instead (see `proxy_pass` below) re-resolves on this TTL, which is also
  # much closer to how the ALB continuously re-registers its targets.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;


  # Mirrors the ALB's own request-id behaviour: reuse an inbound id if the client sent one,
  # otherwise mint one so a request can be traced across tasks and into the workers' logs.
  map $http_x_request_id $request_id_final {
    default   $http_x_request_id;
    ''        $request_id;
  }

  server {
    listen 80;
    server_name _;

    # The ALB terminates TLS in AWS; locally we only need the forwarded headers to look
    # the same so that code depending on them behaves identically.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id_final;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    client_max_body_size 256k;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Retrying a non-idempotent POST at the proxy would create duplicate bookings for
    # requests that arrived without an Idempotency-Key. Let the client decide instead.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # All three API containers share the `api` network alias, so this single name resolves to
    # three addresses and nginx spreads requests across them. Deliberately not ip_hash or any
    # other form of stickiness: sticky sessions would mask exactly the cross-instance state bugs
    # this stack exists to catch. The cost of resolving through a variable is upstream keepalive,
    # which nginx does not support for a dynamic target and which is irrelevant at local volumes.
    location / {
      set $careflow_api api:3000;
      proxy_pass http://$careflow_api;
    }

    location /health {
      access_log off;
      set $careflow_api api:3000;
      proxy_pass http://$careflow_api;
    }
  }
}
